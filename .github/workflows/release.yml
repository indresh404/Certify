name: Release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --windowed --name CertificateGenerator --collect-all customtkinter --add-data "assets/fonts;assets/fonts" main.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/CertificateGenerator/**
